[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist"

[functions]
  external_node_modules = ["pg"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/netlify-handler/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/netlify-handler"
  status = 200
